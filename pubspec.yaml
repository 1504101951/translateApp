publish_to: "none"
# Release metadata supplies the macOS app version and build number.
version: 1.0.0+12

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  characters: ^1.4.1
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
